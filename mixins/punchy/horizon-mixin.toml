  { name="yaw", ty="&mut f32", value="&mut *yaw" },
  { name="pitch", ty="&mut f32", value="&mut *pitch" }
]

[[injection]]
id = "compute_fov"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_compute_fov"
helper = "fov.rs"
bindings = [
  { name="game", ty="&crate::game::Game<'_>", value="&*self" },
  { name="partial", ty="f32", value="partial" },
  { name="camera", ty="[f64; 3]", value="camera" },
  { name="degrees", ty="&mut f32", value="&mut *degrees" }
